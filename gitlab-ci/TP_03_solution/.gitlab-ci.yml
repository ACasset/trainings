spec:
  inputs:
    premier-input:
      description: Ceci est le premier input
      default: "Valeur par défaut pour le premier input"
    second-input:
      description: Ceci est le second input
      default: "Valeur par défaut pour le second input"
---
stages:
  - build
  - test
  - deploy

# Configuration par défaut avec before_script et after_script
default:
  before_script:
    - echo "=== Début du job à $(date) ==="
    - echo "Branche: ${CI_COMMIT_REF_NAME}"
    - echo "Commit: ${CI_COMMIT_SHORT_SHA}"
  after_script:
    - echo "=== Fin du job à $(date) ==="

build-job:
  stage: build
  script:
    - echo "Premier input: $[[ inputs.premier-input ]]"
    - echo "Second input: $[[ inputs.second-input ]]"
    # Utilisation d'une variable CI/CD (définie dans Settings > CI/CD > Variables)
    - echo "Valeur du secret (si défini): ${MON_SECRET:-non défini}"

unit-test-job:
  stage: test
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 60
    - echo "Code coverage is 90%"

lint-test-job:
  stage: test
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 10
    - echo "No lint issues found."

deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."

# Job qui ne s'exécute que lors des pipelines planifiés
scheduled-task:
  stage: build
  script:
    - echo "Ce job ne s'exécute que lors des pipelines planifiés"
    - echo "Exécuté à $(date)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
