stages:
  - build
  - test
  - deploy

variables:
  POSTGRES_PASSWORD: "V3ryS3cur3P@ssw0rd!"

default:
  services:
    - name: postgres:16.8-alpine3.20
      alias: db
      entrypoint: ["docker-entrypoint.sh"]
      command: ["postgres"]

build-job:
  stage: build
  services:
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

get-wordpress-salts:
  stage: build
  image: curlimages/curl:8.13.0
  services:
  script:
    - echo "<?php" > wordpress_salts.php
    - curl --silent https://api.wordpress.org/secret-key/1.1/salt/ >> wordpress_salts.php
    - echo "?>" >> wordpress_salts.php
    - cat wordpress_salts.php
  artifacts:
    paths:
      - wordpress_salts.php

unit-test-job:
  stage: test
  services:
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 60
    - echo "Code coverage is 90%"
  needs:
    - lint-test-job

lint-test-job:
  stage: test
  services:
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 10
    - echo "No lint issues found."

display-php-version:
  stage: test
  image: php:8.4.6-zts-alpine
  services:
  script:
    - php -v
    - cat wordpress_salts.php
  needs:
    - lint-test-job
    - get-wordpress-salts

try-database-connection:
  stage: test
  image: php:8.4.6-zts-alpine
  script:
    - ping -c 4 db
    - echo Mot de passe PostgreSQL = ${POSTGRES_PASSWORD}
  needs:
    - display-php-version

deploy-job:
  stage: deploy
  environment: production
  services:
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
    - exit 1
  allow_failure:
    exit_codes: 1

warn-when-deploy-failure:
  stage: deploy
  services:
  script:
    - echo "Une erreur inattendue (exit code != [0,1]) est survenue !"
  needs:
    - deploy-job
  when: on_failure

warn-when-deploy-success:
  stage: deploy
  services:
  script:
    - echo "Le déploiement s'est déroulé comme attendu !"
  needs:
    - deploy-job
  when: on_success
